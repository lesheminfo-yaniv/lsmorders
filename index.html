<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* מעקב רצפת ייצור: פס כותרת, מוני מצב, עץ הזמנות או לוח שלבים, כרטיס הזמנה בצד, עוזר קולי צף */
:root{
  --bg:#eef1f4;--panel:#fff;--ink:#1b2430;--muted:#5d6b7b;--line:#d6dde5;--steel:#2f4a66;--steel2:#3d6189;
  --accent:#e0a100;--accent-ink:#2a1f00;--ok:#1f7a4c;--warn:#b26b00;--bad:#b3261e;--chip:#e6ebf1;
  --display:"Rubik",Arial,sans-serif;--body:"Assistant",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--panel:#1a222b;--ink:#e7edf3;--muted:#9aa8b7;--line:#2c3743;--steel:#8fb1d4;--steel2:#6d93bb;--accent:#f2b81c;--accent-ink:#1e1600;--ok:#57c28a;--warn:#e8a44a;--bad:#ff8a80;--chip:#24303c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
[hidden]{display:none!important}

/* פס עליון */
.bar{background:var(--steel);color:#fff;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.bar .in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.logo h1{font-size:20px;color:#fff}
.logo small{display:block;font-size:12px;opacity:.8;font-family:var(--body)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;color:#fff;opacity:.8;padding:7px 14px;border-radius:7px;font-weight:600}
.tabs button[aria-selected="true"]{background:#fff;color:var(--steel);opacity:1}
.sp{flex:1}
.who{font-size:13px;opacity:.85}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:6px 10px;font-size:13px}

.wrap{max-width:1500px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
.sync{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.kpi.on{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.filters input{flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.note{font-size:12.5px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* עץ */
.olist{display:grid;gap:8px}
.orow{background:var(--panel);border:1px solid var(--line);border-radius:10px;border-inline-start:5px solid var(--line)}
.orow.miss{border-inline-start-color:var(--warn)} .orow.late,.orow.flag{border-inline-start-color:var(--bad)}
.orow.hist{border-inline-start-color:var(--ok)}
.ohead{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:right}
.ohead .car{color:var(--muted);transition:transform .15s;font-size:13px}
.orow[open-row] .ohead .car{transform:rotate(-90deg)}
.ohead .t1{display:flex;gap:10px;align-items:baseline;min-width:0;flex-wrap:wrap}
.ohead .cust{font-weight:700;font-size:16px}
.ohead .what{color:var(--muted);font-size:13.5px;grid-column:2/4;min-width:0}
.stg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.stg.s-prod{background:color-mix(in srgb,var(--steel2) 22%,transparent);color:var(--steel)}
.stg.s-paint{background:color-mix(in srgb,#9b59b6 20%,transparent);color:#8e44ad}
.stg.s-material{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.stg.s-ready{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent-ink)}
.stg.s-delivered,.stg.s-closed{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:4px;grid-column:2/4}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.b{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);white-space:normal}
.sw{width:10px;height:10px;border-radius:2px;border:1px solid var(--line);display:inline-block;margin-inline-end:4px;vertical-align:-1px}
.obody{padding:0 12px 12px;display:grid;gap:10px}
.tree{display:grid;gap:5px}
.tree details{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tree summary{list-style:none;cursor:pointer;padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"◂";color:var(--muted);transition:transform .12s}
.tree details[open]>summary::before{transform:rotate(-90deg)}
.tree .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.tree .ty{width:9px;height:9px;border-radius:2px}
.tree details.none summary{color:var(--muted);font-weight:600}
.titems{padding:0 10px 8px}
.titem{display:grid;grid-template-columns:80px 1fr auto;gap:2px 10px;padding:7px 0;border-top:1px dashed var(--line);padding-inline-start:14px;position:relative}
.titem::before{content:"";position:absolute;inset-inline-start:4px;top:0;bottom:0;border-inline-start:1px solid var(--line)}
.titem .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.titem .tt{font-weight:600;min-width:0;overflow-wrap:anywhere}
.smartbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px}
.s-cancelled{text-decoration:line-through;opacity:.7}
.tadd{padding:6px 0 2px;padding-inline-start:14px}
.nt{color:inherit!important;font-style:italic}
[hidden]{display:none!important}
.qgrp{margin:0 0 12px}
.today{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}.tlabel{font-weight:700;margin-inline-end:4px}
.tchip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer}.tchip.hot{border-color:#c0392b;background:#c0392b14}.tchip.hot b{color:#c0392b}
.qcard.done{opacity:.75}
.qprev{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:#222;margin:6px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2f4a66;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25)}.qgrp>summary{font-weight:700;padding:8px 0;cursor:pointer}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:grid;gap:6px;border-inline-start:5px solid var(--line)}
.qcard.cold{border-inline-start-color:#c0392b}.qcard.warm{border-inline-start-color:#e0a100}.qcard.new{border-inline-start-color:#1f9d55}
.qcard .r1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}.qbtns{display:flex;flex-wrap:wrap;gap:6px}.qmsg textarea{width:100%;box-sizing:border-box;font:inherit}
.titem .ted{grid-column:1/4;display:flex;gap:14px;justify-content:flex-end}
.lnk{background:none;border:0;padding:2px 0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.lnk:hover{color:inherit}
.tedit{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;align-items:center}
.tedit textarea,.tedit input,.tedit select{width:100%;box-sizing:border-box;font:inherit}
.tedit .tbtns{grid-column:1/3;display:flex;gap:8px;justify-content:flex-end}
.titem .by{font-weight:400;color:var(--muted);font-size:12px}
@media (max-width:600px){.tedit{grid-template-columns:1fr}.tedit .tbtns{grid-column:1}}
.titem .sn{grid-column:2/4;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
a{color:var(--steel2)}

/* לוח */
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.lane{background:var(--chip);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane h3{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:right;display:grid;gap:4px;border-inline-start:4px solid var(--line)}
.card.miss{border-inline-start-color:var(--warn)} .card.late,.card.flag{border-inline-start-color:var(--bad)}
.card .r1{display:flex;justify-content:space-between;gap:8px}
.card .cust{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .what{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* כרטיס צד */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(580px,100%);background:var(--panel);z-index:21;overflow-y:auto;padding:16px 18px 40px;box-shadow:0 0 40px rgba(0,0,0,.25);display:grid;gap:16px;align-content:start}
.sheet .hd{display:flex;justify-content:space-between;gap:10px}
.stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.stepper button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:7px 2px;font-size:11.5px;line-height:1.2;color:var(--muted)}
.stepper button.done{background:color-mix(in srgb,var(--steel2) 18%,var(--panel));color:var(--ink)}
.stepper button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sec h3{font-size:14px;color:var(--steel2);margin-bottom:6px}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px} dl.kv dd{margin:0;overflow-wrap:anywhere}
.box{border-radius:8px;padding:8px 10px;font-size:14px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.box.b{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.edit{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;align-items:center}
.edit input,.edit select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0;width:100%}
textarea{min-height:60px}
.log{display:grid;gap:6px}
.log div{font-size:13.5px;border-inline-start:2px solid var(--line);padding-inline-start:8px}
.log small{color:var(--muted)}

/* כניסה */
.gate{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--steel),#1c2f44)}
.gatebox{background:var(--panel);border-radius:14px;padding:28px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gatebox .logo h1{color:var(--ink)} .gatebox .logo small{color:var(--muted)}
.gatebox input{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.err{color:var(--bad);font-size:13px;min-height:1.2em}

/* עוזר קולי */
.fab{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:30;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
.fab.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.chat{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:92px;z-index:30;width:min(400px,calc(100% - 36px));max-height:65vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat .ch{padding:10px 12px;background:var(--steel);color:#fff;display:flex;gap:8px;align-items:center}
.chat .ch select{background:rgba(255,255,255,.15);border:0;border-radius:6px;color:#fff;padding:3px 6px}
.chat .ch select option{color:#000}
.chat .msgs{padding:10px;overflow-y:auto;display:grid;gap:8px;align-content:start;flex:1}
.m{padding:8px 10px;border-radius:10px;font-size:14.5px;max-width:90%;white-space:pre-wrap}
.m.u{background:var(--chip);justify-self:start}
.m.a{background:color-mix(in srgb,var(--steel2) 14%,var(--panel));justify-self:end}
.m.a small{display:block;color:var(--muted);font-size:11px}
.chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chat form input{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
@media (max-width:600px){dl.kv,.edit{grid-template-columns:90px 1fr}.stepper button{font-size:10.5px}.ohead .cust{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="gate" id="gate">
  <form class="gatebox" id="gateForm">
    <div class="logo"><div class="mark">לש"מ</div><div><h1>הזמנות ל.ש.מ</h1><small>מעקב ייצור ואספקה</small></div></div>
    <label for="whoIn">השם שלך</label>
    <input id="whoIn" autocomplete="name" placeholder="למשל: פזית">
    <label for="pw">סיסמה</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password">
    <div class="err" id="gateErr"></div>
    <button class="btn primary" type="submit" id="gateBtn">כניסה</button>
  </form>
</section>

<div id="app" hidden>
  <header class="bar"><div class="in">
    <div class="logo"><div class="mark">לש"מ</div><div><h1>הזמנות ל.ש.מ</h1><small id="sync">טוען…</small></div></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabLeads" aria-selected="false">לידים ופניות</button>
      <button role="tab" id="tabList" aria-selected="true">עץ הזמנות</button>
      <button role="tab" id="tabBoard" aria-selected="false">לוח ייצור</button>
      <button role="tab" id="tabQuotes" aria-selected="false">הצעות מחיר</button>
      <button role="tab" id="tabHist" aria-selected="false">היסטוריה</button>
    </div>
    <div class="sp"></div>
    <span class="who" id="whoLbl"></span>
    <button class="ghost" id="btnSettings" type="button">הגדרות</button>
    <button class="ghost" id="btnOut" type="button">יציאה</button>
  </div></header>
  <main class="wrap">
    <section class="today" id="today" aria-label="היום"></section>
    <section class="kpis" id="kpis"></section>
    <section class="filters">
      <input id="q" type="search" placeholder="חיפוש או שאלה: לקוח, מספר… או 'תעודת משלוח בלי חשבונית', 'לא שולמו', 'בייצור באיחור'">
      <select id="fSupplier"><option value="">כל הספקים</option></select>
      <select id="fDeliv"><option value="">אספקה: הכל</option><option>הובלה</option><option>הובלה והתקנה</option><option>משלוח</option><option>איסוף עצמי</option><option value="?">לא צוין</option></select>
    </section>
    <section id="view"></section>
  </main>
</div>
<div id="sheetRoot"></div>

<div class="chat" id="chat" hidden>
  <div class="ch"><b>שאל על ההזמנות</b><span class="sp"></span>
    <select id="prov" aria-label="מי עונה"><option value="">אוטומטי</option><option value="gemini">ג'מיני</option><option value="claude">Claude</option></select>
    <button class="ghost" id="replayBtn" type="button" aria-label="הקרא שוב">▶</button>
    <button class="ghost" id="muteBtn" type="button" aria-label="השתק הקראה">🔊</button>
    <button class="ghost" id="chatX" type="button" aria-label="סגור">✕</button></div>
  <div class="msgs" id="msgs"><div class="m a">שאל אותי בקול או בכתב. למשל: "מה מוכן לאספקה?", "מה המצב של נס ציונה?", "אילו הזמנות ממתינות לספק?"</div></div>
  <form id="chatForm"><input id="chatIn" lang="he" enterkeyhint="send" autocomplete="off" placeholder="הקלד שאלה, או לחץ על המיקרופון"><button class="btn primary" type="submit">שלח</button></form>
</div>
<button class="fab" id="fab" type="button" aria-label="שאלה קולית" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>
</button>

<script>
const STAGES=[{k:"new",l:"התקבלה"},{k:"material",l:"ממתין לחומר / ספק"},{k:"prod",l:"בייצור"},{k:"paint",l:"בצבע"},{k:"ready",l:"מוכן לאספקה"},{k:"delivered",l:"סופק"},{k:"closed",l:"חשבונית / סגור"},{k:"cancelled",l:"בוטלה"}];
const OPEN=["new","material","prod","paint","ready"];
const stageL=k=>(STAGES.find(s=>s.k===k)||{l:k||"—"}).l;

  p.needsAI=/למה|מדוע|מה\s+(?:קרה|אמר|ביקש|הבעיה|המצב)|מה\s+לעשות|תסביר|סכם|תסכם|האם\s+כדאי|מה\s+דעתך|איך|מתי\s+(?:הבטחנו|צריך)/.test(q);
  return p}
function rowTxt(o){const d=docs(o),r=rdocs(o);
  return [(isQ(o)?"הצעה ":isL(o)?"פנייה ":"הזמנה ")+(o.num||""),"לקוח: "+(o.customer||""),"תאריך: "+(o.date||""),"שלב: "+stageL(o.stage),"מוצר: "+[o.qty,o.model,o.desc].filter(Boolean).join(" "),o.color&&"צבע: "+o.color,o.delivery&&"אספקה: "+o.delivery,o.address&&"כתובת: "+o.address,(o.contact||o.phone)&&"איש קשר: "+[o.contact,o.phone].filter(Boolean).join(" "),o.orderTotal&&"סכום: "+o.orderTotal,o.custPO&&"הזמנת לקוח: "+o.custPO,o.closedDate&&"סופק/נסגר: "+o.closedDate,o.promised&&"הובטח: "+o.promised,
    sup(o)&&"ספקים: "+(o.suppliers||[]).map(s=>[s.name,s.role,s.item,s.status].filter(Boolean).join(" ")).join(", "),(o.flags||[]).length&&"לבדוק: "+o.flags.join("; "),(o.rivhitLines||[]).length&&"שורות: "+o.rivhitLines.slice(0,6).join("; "),
    "תעודות משלוח: "+(r.dn.length?r.dn.map(x=>x.date+" "+nis(x.amt)).join(", "):"אין"),"חשבוניות: "+(r.inv.length?r.inv.map(x=>x.date+" "+nis(x.amt)+(x.paid?" שולמה "+x.rec.join(","):" לא שולמה")).join(", "):"אין"),
    o.prodNotes&&"הערות: "+String(o.prodNotes).slice(0,300),(o.links||[]).filter(l=>!l.hidden&&l.type!=="rivhit").slice(-5).map(l=>(l.date||"")+" "+(l.title||"")+(l.snippet?": "+String(l.snippet).slice(0,160):"")).join(" | "),(o.log||[]).slice(-3).map(l=>(l.t||"").slice(0,10)+" "+(l.by?l.by+": ":"")+l.text).join(" | ")].filter(Boolean).join(" · ")}
function showResult(res){S.qsel=new Set(res.rows.map(o=>o.id));S.qlabel=res.label||"";S.kpi="";S.qst="all";$("q").value="";
  S.tab=res.kind==="quotes"?"quotes":res.kind==="leads"?"leads":(res.rows.length&&res.rows.every(o=>!OPEN.includes(o.stage))?"hist":"list");render()}
function clearSel(){if(S.qsel){S.qsel=null;S.qlabel=""}}
async function send(t){$("chatIn").value="";addMsg("u",t);const t0=Date.now();
  let p=localPlan(t),res=null,src="מהנתונים בדשבורד";
  const useAI=!!(S.ai&&(S.ai.gemini||S.ai.claude)),secs=()=>" · "+((Date.now()-t0)/1000).toFixed(1)+" שנ'";
  try{res=execPlan(p)}catch(e){res=null}
  const weak=!res||!res.n||(!p.preds.length&&!p.date&&p.metric==="list"&&!p.needsAI&&res.n>40);
  if(useAI&&(!p.smart||weak)){const w=addMsg("a","מבין את השאלה…");
    try{const r=await run("plan",S.pw,t,S.hist,$("prov").value);const ap=r.plan||{};
      if(ap.kind||ap.stages||(ap.text&&ap.text.length)||ap.date||ap.docs||ap.metric){const np=Object.assign({},ap,{preds:[],labels:[],text:ap.text||[],needsAI:!!ap.needsAI||p.needsAI});const r2=execPlan(np);if(r2.n||!res||!res.n){p=np;res=r2}}
      else if(ap.needsAI)p.needsAI=true;
      src=(r.provider==="gemini"?"ג'מיני":"Claude")+" + הנתונים"}
    catch(e){src="מהנתונים בדשבורד (המודל לא זמין: "+e.message+")"}
    w.remove()}
  if(res&&!p.needsAI){addMsg("a",res.text,src+secs());S.lastAns=res.head;speak(res.head);S.hist=S.hist.concat([{role:"user",content:t},{role:"assistant",content:res.text}]).slice(-6);if(res.n)showResult(res);return}
  if(!useAI){addMsg("a",res&&res.text?res.text:"לא מצאתי. נסה לנסח אחרת, למשל: 'הזמנות של נס ציונה' או 'תעודת משלוח בלי חשבונית'.");if(res&&res.n)showResult(res);return}
  const w=addMsg("a","חושב…");
  const base=res&&res.n?res.rows:null;
  const facts=base?(res.head+"\n"+base.slice(0,25).map(rowTxt).join("\n")):"";
  try{const r=await run("ask",S.pw,t,S.hist,$("prov").value,facts);w.replaceWith(addMsg("a",r.answer,(r.provider==="gemini"?"ג'מיני":"Claude")+(base?" · לפי "+Math.min(base.length,25)+" מתוך "+base.length+" רשומות":" · לפי כל הנתונים")+secs()));S.hist=S.hist.concat([{role:"user",content:t},{role:"assistant",content:r.answer}]).slice(-6);S.lastAns=r.answer;speak(r.answer);if(base)showResult(res)}
  catch(e){w.textContent=e.message}}
function speak(t){if(S.muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";const v=speechSynthesis.getVoices().find(x=>/he|iw/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
